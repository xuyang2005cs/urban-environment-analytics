<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Urban Environment Analytics Platform architecture</title>
  <desc id="desc">Open-Meteo data flows through collection, raw JSON, normalization, quality checks, Parquet, DuckDB, FastAPI and the React web application. APScheduler, watermarks, collection runs and GitHub Actions support the pipeline.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F6B57"/></marker>
    <marker id="control-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#66756F"/></marker>
    <style>
      .eyebrow{font:600 15px 'IBM Plex Mono','Microsoft YaHei',monospace;letter-spacing:2.4px;fill:#1F6B57}.title{font:600 40px 'IBM Plex Sans','Microsoft YaHei',sans-serif;fill:#142821}.subtitle{font:400 18px 'IBM Plex Sans','Microsoft YaHei',sans-serif;fill:#52635D}.stage{font:600 13px 'IBM Plex Mono','Microsoft YaHei',monospace;letter-spacing:1.7px;fill:#66756F}.node-title{font:600 22px 'IBM Plex Sans','Microsoft YaHei',sans-serif;fill:#142821}.node-detail{font:400 15px 'IBM Plex Sans','Microsoft YaHei',sans-serif;fill:#52635D}.support-title{font:600 16px 'IBM Plex Sans','Microsoft YaHei',sans-serif;fill:#142821}.support-detail{font:400 13px 'IBM Plex Sans','Microsoft YaHei',sans-serif;fill:#66756F}.legend{font:400 13px 'IBM Plex Mono','Microsoft YaHei',monospace;fill:#66756F}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#F2F5F2"/>
  <path d="M0 132 H1600 M0 724 H1600" stroke="#D8E0DC" stroke-width="1"/>
  <path d="M80 94 H226" stroke="#1F6B57" stroke-width="3"/>
  <text x="80" y="58" class="eyebrow">ENVIRONMENTAL DATA PATH</text>
  <text x="80" y="111" class="title">From public observations to a usable product</text>
  <text x="80" y="164" class="subtitle">A traceable pipeline for six-city weather and air-quality analytics</text>
  <g transform="translate(80 225)"><text x="0" y="0" class="stage">01 · DATA SOURCE</text><rect x="0" y="24" width="180" height="178" rx="3" fill="#FCFDFB" stroke="#AFC0B9"/><circle cx="28" cy="56" r="7" fill="#287F91"/><text x="24" y="101" class="node-title">Open-Meteo</text><text x="24" y="132" class="node-detail">Weather</text><text x="24" y="157" class="node-detail">Air Quality</text><text x="24" y="182" class="node-detail">Geocoding</text></g>
  <path d="M270 338 H302" stroke="#1F6B57" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g transform="translate(312 225)"><text x="0" y="0" class="stage">02 · INGESTION</text><rect x="0" y="24" width="180" height="178" rx="3" fill="#FCFDFB" stroke="#AFC0B9"/><path d="M24 60 H66 M24 68 H57" stroke="#B47626" stroke-width="3"/><text x="24" y="101" class="node-title">Collector</text><text x="24" y="132" class="node-detail">Retry &amp; timeout</text><text x="24" y="157" class="node-detail">Per-city isolation</text><text x="24" y="182" class="node-detail">Incremental fetch</text></g>
  <path d="M502 338 H534" stroke="#1F6B57" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g transform="translate(544 225)"><text x="0" y="0" class="stage">03 · RAW LAYER</text><rect x="0" y="24" width="180" height="178" rx="3" fill="#FCFDFB" stroke="#AFC0B9"/><path d="M25 53 H68 V79 H25 Z M33 60 H60 M33 68 H52" fill="none" stroke="#287F91" stroke-width="2"/><text x="24" y="101" class="node-title">Raw JSON</text><text x="24" y="132" class="node-detail">Source fidelity</text><text x="24" y="157" class="node-detail">Run partitioning</text><text x="24" y="182" class="node-detail">Replayable input</text></g>
  <path d="M734 338 H766" stroke="#1F6B57" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g transform="translate(776 225)"><text x="0" y="0" class="stage">04 · PROCESSING</text><rect x="0" y="24" width="180" height="178" rx="3" fill="#FCFDFB" stroke="#AFC0B9"/><path d="M24 64 H66" stroke="#B47626" stroke-width="3"/><text x="24" y="101" class="node-title">Normalize</text><path d="M24 119 H156" stroke="#D8E0DC"/><text x="24" y="151" class="node-title">Quality</text><text x="24" y="182" class="node-detail">UTC · schema · gaps</text></g>
  <path d="M966 338 H998" stroke="#1F6B57" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g transform="translate(1008 225)"><text x="0" y="0" class="stage">05 · STORAGE</text><rect x="0" y="24" width="180" height="178" rx="3" fill="#FCFDFB" stroke="#AFC0B9"/><text x="24" y="91" class="node-title">Parquet</text><path d="M24 115 H151" stroke="#1F6B57" stroke-width="2" marker-end="url(#arrow)"/><text x="24" y="156" class="node-title">DuckDB</text><text x="24" y="182" class="node-detail">Analytical views</text></g>
  <path d="M1198 338 H1230" stroke="#1F6B57" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g transform="translate(1240 225)"><text x="0" y="0" class="stage">06 · SERVING</text><rect x="0" y="24" width="130" height="178" rx="3" fill="#FCFDFB" stroke="#AFC0B9"/><circle cx="28" cy="61" r="7" fill="#1F6B57"/><text x="20" y="106" class="node-title">FastAPI</text><text x="20" y="140" class="node-detail">Read-only</text><text x="20" y="165" class="node-detail">analytics API</text></g>
  <path d="M1380 338 H1412" stroke="#1F6B57" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g transform="translate(1422 225)"><text x="0" y="0" class="stage">07 · PRODUCT</text><rect x="0" y="24" width="130" height="178" rx="3" fill="#142821" stroke="#142821"/><circle cx="26" cy="60" r="7" fill="#64B7C4"/><text x="18" y="106" style="font:600 22px 'IBM Plex Sans','Microsoft YaHei',sans-serif;fill:#FCFDFB">React</text><text x="18" y="140" style="font:400 15px 'IBM Plex Sans','Microsoft YaHei',sans-serif;fill:#C8D5D0">Web app</text><text x="18" y="165" style="font:400 15px 'IBM Plex Sans','Microsoft YaHei',sans-serif;fill:#C8D5D0">6 city views</text></g>
  <text x="80" y="514" class="eyebrow">OPERATIONS &amp; ASSURANCE</text><path d="M80 536 H1552" stroke="#AFC0B9"/>
  <g transform="translate(312 568)"><rect width="180" height="112" rx="3" fill="#E9EFEC" stroke="#AFC0B9"/><circle cx="24" cy="29" r="5" fill="#B47626"/><text x="39" y="35" class="support-title">APScheduler</text><text x="24" y="66" class="support-detail">Timed collection</text><text x="24" y="89" class="support-detail">Cross-process lock</text></g><path d="M402 568 V438" stroke="#66756F" stroke-width="1.5" stroke-dasharray="6 6" marker-end="url(#control-arrow)"/>
  <g transform="translate(776 568)"><rect width="180" height="112" rx="3" fill="#E9EFEC" stroke="#AFC0B9"/><circle cx="24" cy="29" r="5" fill="#287F91"/><text x="39" y="35" class="support-title">Watermarks</text><text x="24" y="66" class="support-detail">City / dataset state</text><text x="24" y="89" class="support-detail">Idempotent replay</text></g><path d="M866 568 V438" stroke="#66756F" stroke-width="1.5" stroke-dasharray="6 6" marker-end="url(#control-arrow)"/>
  <g transform="translate(1008 568)"><rect width="180" height="112" rx="3" fill="#E9EFEC" stroke="#AFC0B9"/><circle cx="24" cy="29" r="5" fill="#1F6B57"/><text x="39" y="35" class="support-title">Collection Runs</text><text x="24" y="66" class="support-detail">Rows &amp; duration</text><text x="24" y="89" class="support-detail">Failure trace</text></g><path d="M1098 568 V438" stroke="#66756F" stroke-width="1.5" stroke-dasharray="6 6" marker-end="url(#control-arrow)"/>
  <g transform="translate(1372 568)"><rect width="180" height="112" rx="3" fill="#E9EFEC" stroke="#AFC0B9"/><circle cx="24" cy="29" r="5" fill="#142821"/><text x="39" y="35" class="support-title">GitHub Actions</text><text x="24" y="66" class="support-detail">Python &amp; frontend</text><text x="24" y="89" class="support-detail">Test · typecheck · build</text></g><path d="M1462 568 V438" stroke="#66756F" stroke-width="1.5" stroke-dasharray="6 6" marker-end="url(#control-arrow)"/>
  <g transform="translate(80 783)"><path d="M0 0 H44" stroke="#1F6B57" stroke-width="2.5" marker-end="url(#arrow)"/><text x="62" y="5" class="legend">DATA FLOW</text><path d="M215 0 H259" stroke="#66756F" stroke-width="1.5" stroke-dasharray="6 6" marker-end="url(#control-arrow)"/><text x="277" y="5" class="legend">CONTROL / EVIDENCE</text></g>
  <text x="1520" y="793" text-anchor="end" class="legend">6 CITIES · HOURLY OBSERVATIONS · INCREMENTAL ETL</text>
</svg>
